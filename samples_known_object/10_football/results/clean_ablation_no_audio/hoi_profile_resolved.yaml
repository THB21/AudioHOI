case_name: football
object_category: football
object_family: dynamic_ball
object_parts:
- name: ball_center
  role: 2d_center_anchor
- name: ball_boundary
  role: mask_radius_anchor
- name: ball_bottom
  role: floor_support_anchor
human_parts:
- foot
- floor
interaction_edges:
- human_part: foot
  object_part: ball_boundary
  relation: kick_touch
- human_part: foot
  object_part: ball_boundary
  relation: juggle_touch
- human_part: floor
  object_part: ball_bottom
  relation: support
support_priors:
- floor_support
motion_priors:
- smooth_ball_translation
- foot_contact_depth_stabilization
- gravity_ball_trajectory
vlm_query_policy:
  stage0:
  - target_mask_check
  stage1:
  - keypart_identity_check
  - track_stability_check
  stage2:
  - contact_relation_check
  - kick_impulse_validation
  stage3:
  - overlay_alignment_check
  stage4:
  - anchor_update_check
  - temporal_motion_check
  - juggling_sequence_consistency
  stage5:
  - post_render_sanity_check
source: mistral_llm_schema_validated
schema_version: 1
rules:
  llm_outputs_pose: false
  vlm_outputs_pose: false
  vlm_outputs_loss_weights: false
  optimizer_is_only_continuous_solver: true
source_prompt_count: 5
source_prompts:
- kind: sample_metadata.prompt
  path: samples_known_object/10_football/metadata.json
  record_id: ''
  text_preview: 'Generate an 8-second realistic video from this image. The soccer
    player starts with the ball on the grass near one foot. The player first kicks
    the ball upward with one foot, then keeps the ball close and performs a short
    controlled juggling sequence using the feet. The ball should move naturally according
    to the player’s foot contact and gravity, without floating or changing direction
    by itself. Keep the camera static in a wide shot, with the full body and the soccer
    ball visible for most of the sequence.Add realistic synchronized audio: a clear
    foot-ball kick sound at the first kick, followed by light foot-ball contact sounds
    during the juggling touches. The contact sounds should occur only when the ball
    visibly touches the foot. No music, no speech.'
- kind: sample_metadata.detection_text
  path: samples_known_object/10_football/metadata.json
  record_id: ''
  text_preview: football.
