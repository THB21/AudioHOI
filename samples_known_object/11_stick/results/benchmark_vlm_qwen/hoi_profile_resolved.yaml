  text_preview: 'Generate an 8-second realistic video from this image. The person
    performs a short martial arts staff routine using the same long wooden staff.
    The sequence should include several natural staff movements such as swinging,
    turning, and changing stance. During the routine, the staff should lightly tap
    the ground one or two times as part of the movement. Keep the camera static in
    a wide shot, with the full body and the staff visible throughout most of the sequence.
