case_name: basketball
sample_dir: samples_known_object/01_basketball
object_family: dynamic_ball
geometry_model: sphere_proxy
geometry_asset_descriptor: scripts/shared/generic_contact_pipeline/configs/assets/sphere_proxy.json
sphere:
  radius_m: 0.12
support_geometry_input: samples_known_object/01_basketball/results/pose6d_object_proxy_da3_init/support_geometry.json
observation_model: mask_track_center
contact_policy: hand_floor
pose_model: translation3
generic_object_problem:
  initializer: point_depth
  initializer_artifacts:
    - object_observations.csv
    - contact_state_frames.csv
    - contact_candidates_internal/contact_candidates_labeled.csv
  contact_artifact: object_contact_points.csv
  contact_state_artifact: contact_state_frames.csv
  contact_source: event_directional
  contact_event_artifact: contact_candidates_internal/contact_candidates_labeled.csv
  contact_target_feature: object:center
  contact_residual_axes: [2]
  maximum_contact_offset_m: 1.0
  depth_reference: directional_contact_interpolation
  measurement_factors: [point_reprojection, metric_depth]
  measurement_roles:
    point_reprojection: [object_center]
    metric_depth: [object_center_depth]
  sequence_factors: [temporal_acceleration, static_freeze]
factor_runtime:
  point_reprojection:
    weight: 1.0
    sigma: 5.0
    sigma_unit: px
    source: measurement_ir:center_and_support_pixel_uncertainty
    activation_weight_tiers: {active: 1.0, downweighted: 0.25, inactive: 0.0}
  metric_depth:
    weight: 0.245
    sigma: 0.35
    sigma_unit: m
    source: measurement_ir:monocular_metric_depth_weak_prior
    activation_weight_tiers: {active: 1.0, downweighted: 0.25, inactive: 0.0}
  contact_distance:
    weight: 1.0
    sigma: 0.035
    sigma_unit: m
    source: interaction_state:fixed_human_site_to_object_surface
    activation_weight_tiers: {active: 1.0, downweighted: 0.25, inactive: 0.0}
  temporal_acceleration:
    weight: 1.0
    state_scales: [0.8, 0.67, 0.2]
    source: sequence_translation_optimizer:second_difference_continuity
    activation_weight_tiers: {active: 1.0, downweighted: 0.12, inactive: 0.0}
  static_freeze:
    weight: 100.0
    state_scales: [0.8, 0.67, 0.2]
    source: generic_supported_static_interval_anchor
    activation_weight_tiers: {active: 1.0, downweighted: 0.0, inactive: 0.0}
refinement_policy:
  - generic_sphere_sequence
  - backproject_xy
render_backend: proxy_sphere
result_name: generic_pipeline_v1
vlm:
  target: basketball
  parts: [ball_center, ball_boundary, ball_bottom, background, unclear]
  contacts: [hand, floor, body, nothing_nearby, unclear]
  stable_refs: [center, bottom_support, boundary_point, unclear]
camera:
  fx: 1468.604736328125
  fy: 1468.604736328125
  cx: 640.0
  cy: 360.0
baseline:
  final_pose_csv: samples_known_object/01_basketball/results/pose6d_object_proxy_anchor_refined/object_pose6d_sharedcam_contactphase_trajectory.csv
  init_pose_csv: samples_known_object/01_basketball/results/pose6d_object_proxy_da3_init/object_pose6d_sharedcam_trajectory.csv
  object_observations_csv: samples_known_object/01_basketball/results/object_observations/object_observations.csv
  object_proxy_observations_csv: samples_known_object/01_basketball/results/object_proxy_observations/object_proxy_observations.csv
  contact_candidates_csv: samples_known_object/01_basketball/results/contact_candidates_object_proxy/anchor_contact_candidates.csv
  contact_state_csv: samples_known_object/01_basketball/results/contact_candidates_object_proxy/contact_state_frames.csv
  render_dir: samples_known_object/01_basketball/results/renders/pose6d_object_proxy_anchor_refined
