geometry_model: articraft_mug_mesh
observation_model: rigid_body_plus_parts
contact_policy: palm_handle_rim_body
pose_model: rigid6_plus_phase
refinement_policy:
  - stable_grasp_anchor
  - anchor_depth
  - table_freeze
render_backend: articraft_mesh
result_name: generic_pipeline_v1
vlm:
