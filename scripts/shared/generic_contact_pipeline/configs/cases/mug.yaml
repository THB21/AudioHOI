  object_pose_init_csv: samples_known_object/02_mug/results/benchmark_vlm_qwen/object_pose_init.csv
  final_pose_csv: samples_known_object/02_mug/results/final_result/object_pose.csv
  final_phase_csv: samples_known_object/02_mug/results/final_result/handle_phase.csv
  m15_recovered_phase_csv: samples_known_object/02_mug/results/renders/M15_original_phase_recovered/handle_phase_joint_contact.csv
  m17_phase_csv: samples_known_object/02_mug/results/renders/M17_phase_corrected/corrected_handle_phase.csv
  m18_pose_csv: samples_known_object/02_mug/results/mug_m18_opening_2d_video_correction/mug_m18_opening_2d_video_pose.csv
  contact_state_csv: samples_known_object/02_mug/results/contact_candidates_object_proxy/contact_state_frames.csv
  object_local_points_csv: samples_known_object/02_mug/results/mug_articraft_contact_points/mug_articraft_contact_points.csv
  grasp_anchor_csv: samples_known_object/02_mug/results/mug_grasp_anchor_state/mug_grasp_anchor_state.csv
  render_dir: samples_known_object/02_mug/results/renders/final_result
