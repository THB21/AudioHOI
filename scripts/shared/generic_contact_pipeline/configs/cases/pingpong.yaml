case_name: pingpong
sample_dir: samples_known_object/14_pingpong_wall
object_family: dynamic_ball
geometry_model: sphere_proxy
observation_model: mask_track_center
contact_policy: hand_floor
pose_model: translation3
refinement_policy: [anchor_depth, backproject_xy]
render_backend: mesh_solid
object_mesh_metric: fit_radius
result_name: generic_pipeline_v1
preprocess: {auto_run: false, fps: 24.0}
vlm:
  target: ping-pong ball
  parts: [ball_center, ball_boundary, background, unclear]
  contacts: [paddle, wall, hand, nothing_nearby, unclear]
  stable_refs: [center, boundary_point, unclear]
camera: {fx: 1468.604736328125, fy: 1468.604736328125, cx: 640.0, cy: 360.0}
baseline:
  final_pose_csv: samples_known_object/14_pingpong_wall/results/pingpong_stage0_audit/object_pose.csv
  init_pose_csv: samples_known_object/14_pingpong_wall/results/ablation_evaluation/frozen_poses/no_audio_object_pose.csv
  object_observations_csv: samples_known_object/14_pingpong_wall/results/final_full_4d_hoi/object_observations.csv
  contact_candidates_csv: samples_known_object/14_pingpong_wall/results/final_full_4d_hoi/contact_candidates.csv
  contact_state_csv: samples_known_object/14_pingpong_wall/results/final_full_4d_hoi/contact_state_frames.csv
