case_name: pingpong_wall
sample_dir: samples_known_object/14_pingpong_wall
object_family: dynamic_small_sphere
geometry_model: sphere_proxy
geometry_asset_descriptor: scripts/shared/generic_contact_pipeline/configs/assets/sphere_proxy.json
sphere:
  radius_m: 0.020
observation_model: mask_track_center
contact_policy: hand_floor
pose_model: translation3
refinement_policy:
  - generic_sphere_sequence
  - backproject_xy
render_backend: proxy_sphere
result_name: pure_solver_no_audio_no_vlm
preprocess:
  fps: 24.0
  static_camera: true
  detector_model: IDEA-Research/grounding-dino-tiny
  detector_text: white ping-pong ball.
  first_frame_box: 700,245,735,278
  segmenter_model: facebook/sam2.1-hiera-tiny
  tracker: cotracker3_online
  tracker_query_source: sam2_mask_center
  tracker_sequence_mode: persistent_online
  tracker_grid_size: 6
  tracker_resize_width: 512
  da3_chunk_size: 16
  da3_process_res: 504
generic_object_problem:
  initializer: point_depth
  initializer_artifacts:
    - object_observations.csv
    - contact_state_frames.csv
    - contact_candidates_internal/contact_candidates_labeled.csv
  contact_artifact: sphere_no_metric_contact_constraints.csv
  interaction_state_artifact: impact_interaction_states.csv
  interaction_state_exclusive: true
  measurement_factors: [point_reprojection, metric_depth]
  measurement_roles:
    point_reprojection: [object_center]
    metric_depth: [object_center_depth]
  sequence_factors: [temporal_acceleration]
factor_runtime:
  point_reprojection:
    weight: 1.0
    sigma: 5.0
    sigma_unit: px
    source: measurement_ir:single_identity_sphere_candidate
    activation_weight_tiers: {active: 1.0, downweighted: 0.15, inactive: 0.0}
  metric_depth:
    weight: 0.20
    sigma: 0.40
    sigma_unit: m
    source: measurement_ir:small_sphere_monocular_depth_weak_prior
    activation_weight_tiers: {active: 1.0, downweighted: 0.15, inactive: 0.0}
  temporal_acceleration:
    weight: 15.0
    state_scales: [0.5, 0.5, 0.3]
    source: sequence_translation_optimizer:contact_gated_ballistic_continuity
    activation_weight_tiers: {active: 1.0, downweighted: 0.005, inactive: 0.0}
vlm:
  target: single physical white ping-pong ball
  parts: [physical_ball_candidate, duplicate_generation_artifact, motion_blur_streak, background, unclear]
  contacts: [paddle_face, practice_wall, no_contact, unclear]
  stable_refs: [same_ball_from_previous_frame, same_ball_to_next_frame, event_consistent_candidate, unclear]
  frame_policy:
    stage0: risk
    stage1: risk
    stage2: risk
    stage4: risk
  single_identity:
    enabled: true
    entity_id: pingpong_ball
    maximum_entities: 1
    candidate_artifact: sphere_identity_candidates.csv
    selected_artifact: sphere_identity_selection.csv
    forced_choices: [candidate_a, candidate_b, occluded_or_blurred, unclear]
    evidence_offsets_frames: [-2, -1, 0, 1, 2]
    enforce_contact_only_direction_change: true
audio:
  expected_event_order: [paddle_impact, wall_impact]
  alternating: true
  event_count:
    paddle_impact: 5
    wall_impact: 5
camera:
  fx: 1468.604736328125
  fy: 1468.604736328125
  cx: 640.0
  cy: 360.0
