case_name: stick
sample_dir: samples_known_object/11_stick
object_family: rigid_staff
geometry_model: articraft_urdf
observation_model: mask_track_center
contact_policy: persistent_two_palm_line
pose_model: translation3
refinement_policy:
  - line_contact_lock
  - backproject_xy
render_backend: urdf_solid
render_scene: generic_urdf
result_name: generic_pipeline_v1
preprocess:
