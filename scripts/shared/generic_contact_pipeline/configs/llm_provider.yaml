default_provider: claude
providers:
  claude:
    kind: claude_cli
    model_id: sonnet
    temperature: 0.0
    max_new_tokens: 1200
    timeout_seconds: 180
    mode: schema_guarded_seed_fallback
    note: >
      Claude via the local `claude` CLI (headless -p), using the user's Claude subscription --
      NO API key. Each call runs from a neutral cwd so no project CLAUDE.md / memory /
      conversation is loaded (fresh Claude, no background knowledge) and judges only the data
      in the prompt. Used for the discrete data-movement audit (Stage -1 HOI prior + Stage 6.5
      CSV audit + live stage gates); output is schema-validated to discrete labels / flags /
      re-run recipes only -- never pose, coordinates, or loss weights. Set model_id to
      sonnet|opus|haiku to pick the model.
  claude_api:
    kind: anthropic_messages
    api_key_env: ANTHROPIC_API_KEY
    model_id: claude-sonnet-5
    base_url: https://api.anthropic.com/v1
    temperature: 0.0
    max_new_tokens: 1200
    timeout_seconds: 120
    note: Direct Anthropic API alternative to the CLI (needs ANTHROPIC_API_KEY in .env).
  mistral_api:
    kind: mistral_chat_completions
    api_key_env: MISTRAL_API_KEY
    model_id_env: MISTRAL_MODEL_ID
    model_id: mistral-small-latest
    base_url_env: MISTRAL_BASE_URL
    base_url: https://api.mistral.ai/v1
    temperature: 0.0
    max_new_tokens: 900
    timeout_seconds: 120
    mode: schema_guarded_seed_fallback
    note: >
      Text-only LLM provider for Stage -1 HOI semantic priors. The response is
      schema validated and may only define discrete semantic parts, interaction
      edges, support/motion priors, and VLM query policies.
  qwen_local:
    kind: qwen_text_or_vl
    python: /home/hebestreit/miniforge3/envs/qwen-vl/bin/python
    mode: schema_guarded_seed_fallback
    note: >
      The first v2 implementation uses deterministic seed profiles. Local Qwen
      may be connected later, but every generated HOI profile must pass
      core.hoi_profile validation and must never emit pose, coordinates, or
      continuous loss weights.
